# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.realarqade.thenothingmod

# Dependencies
fabric_api_version=0.165.0+26.3

# Optional config screen
yacl_version=3.9.7+26.3-fabric
modmenu_version=21.0.0

# NeoForge
moddev_version=2.0.148
neoforge_version=26.3.0.101
yacl_neoforge_version=3.9.7+26.3-neoforge

# Forge
forge_version=26.3-66.1.5
net.minecraftforge.gradle.merge-source-sets=true

# Which Minecraft versions the Fabric jar accepts (Fabric's version syntax)
minecraft_range=~26.3

# Which compat/<folder> holds this Minecraft version's small name differences
compat=26.3

# Environment attributes in the dimension types that this Minecraft version does not know (comma separated; left out at build time)
drop_attributes=
# Forge's loader (language) version
forge_spec=66

# Java version the mod is compiled for (25 for 26.x, 21 for 1.21.x, 17 for 1.18-1.20.4)
java_version=25

# '' for Minecraft 26.1+ (unobfuscated); '-remap' to use Loom's remapping plugin for older, obfuscated versions
loom_suffix=

# Textual class renames applied to the shared sources for older Minecraft versions (Old~New;Old2~New2; the characters = > | & cannot be used because gradlew.bat passes through cmd); see neoforge/build.gradle
source_replacements=

# 'legacy' for Minecraft versions whose dimension_type JSON has no attributes/timelines (1.21.10 and older): the build rewrites those files
dim_format=

# Forge: a plain pack_format for the mod's pack.mcmeta on versions older than the min_format/max_format scheme (empty = leave as is)
pack_format=

# 'legacy' for Minecraft 1.21.3 and older: item models live in models/item (generated from items/*.json at build time)
item_models=

# 'legacy' for Minecraft 1.20.6 and older: plural data folder names (loot_tables ...), renamed at build time
data_paths=

# 'false' to leave YetAnotherConfigLib out of the jar (versions whose YACL needs Kotlin for Forge); the config then lives in the JSON file only
bundle_yacl=

# Name of the NeoForge metadata file inside the jar (NeoForge before 1.20.5 wants mods.toml)
mods_toml_name=
